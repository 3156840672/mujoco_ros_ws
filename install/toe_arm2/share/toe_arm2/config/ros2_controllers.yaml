controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: 
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
    gains:
      joint1: {p: 200.0, d: 20.0}
      joint2: {p: 200.0, d: 20.0}
      joint3: {p: 200.0, d: 20.0}
      joint4: {p: 200.0, d: 20.0}
      joint5: {p: 200.0, d: 20.0}
      joint6: {p: 200.0, d: 20.0}