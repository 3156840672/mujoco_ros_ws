controller_manager:
  ros__parameters:
    update_rate: 100

    # 发布关节状态（必须有）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 机械臂轨迹控制器（MoveIt 就是用它）
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# 👇 这个必须和上面的 joint_trajectory_controller 名字一致
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # 可选但强烈推荐（防止轨迹抖动）
    # allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5